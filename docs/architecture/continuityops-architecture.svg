<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ContinuityOps architecture</title>
  <desc id="desc">Cloud engineering portfolio architecture from agentic build orchestration through GitHub OIDC delivery, managed Kubernetes and serverless runtime, observability, incident response, verified recovery, evidence, performance and cost.</desc>
  <defs>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65e0d0"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f3b943"/></marker>
    <style>
      .band{fill:#0b2030;stroke:#2a6f83;stroke-width:2}.box{fill:#12394a;stroke:#36a4b8;stroke-width:2}.live{fill:#0e5a62;stroke:#4fd1c5;stroke-width:2}.ok{fill:#0a696d;stroke:#65e0d0;stroke-width:2}.gate{fill:#59461e;stroke:#f3b943;stroke-width:2}.agent{fill:#3d354b;stroke:#d5a84b;stroke-width:2}.label{font:700 12px Arial,sans-serif;fill:#8ecfe0;letter-spacing:1px}.t{font:13px Arial,sans-serif;fill:#fff;text-anchor:middle}.b{font-weight:700}.edge{fill:none;stroke:#65e0d0;stroke-width:2.5;marker-end:url(#tealArrow)}.warn{fill:none;stroke:#f3b943;stroke-width:2.5;marker-end:url(#amberArrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#081827"/>
  <text x="50" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#eaf6ff">ContinuityOps — Cloud Reliability and Recovery Platform</text>
  <text x="52" y="78" font-family="Arial,sans-serif" font-size="15" fill="#8ecfe0">Governed build → cloud runtime → observable incident → verified recovery</text>

  <rect class="band" x="50" y="110" width="1500" height="150" rx="14"/><text class="label" x="75" y="138">AGENTIC BUILD ORCHESTRATION</text>
  <g><rect class="box" x="85" y="165" width="190" height="65" rx="10"/><text class="t" x="180" y="192"><tspan x="180">Chief Supervisor</tspan><tspan class="b" x="180" dy="20">+ junior exception seat</tspan></text></g>
  <g><rect class="box" x="325" y="165" width="220" height="65" rx="10"/><text class="t" x="435" y="192"><tspan x="435">Grok monitor + GPT orch</tspan><tspan class="b" x="435" dy="20">councils / zero-hop</tspan></text></g>
  <g><rect class="live" x="595" y="165" width="235" height="65" rx="10"/><text class="t" x="712" y="192"><tspan x="712">Up to 3 Disjoint Ralphy Streams</tspan><tspan class="b" x="712" dy="20">Sequential inside each stream</tspan></text></g>
  <g><rect class="live" x="880" y="165" width="230" height="65" rx="10"/><text class="t" x="995" y="192"><tspan x="995">Codex 5.4 CLI Cloud Agents</tspan><tspan class="b" x="995" dy="20">/fast implementation</tspan></text></g>
  <g><rect class="agent" x="1160" y="165" width="210" height="65" rx="10"/><text class="t" x="1265" y="192"><tspan x="1265">Saved Repair Council</tspan><tspan class="b" x="1265" dy="20">→ Fresh Judge Council</tspan></text></g>
  <g><rect class="agent" x="1410" y="165" width="110" height="65" rx="10"/><text class="t" x="1465" y="190"><tspan x="1465">Append-Only</tspan><tspan class="b" x="1465" dy="20">Break/Fix</tspan></text></g>
  <path class="edge" d="M275 198H325"/><path class="edge" d="M545 198H595"/><path class="edge" d="M830 198H880"/><path class="warn" d="M1110 198H1160"/><path class="warn" d="M1370 198H1410"/>

  <rect class="band" x="50" y="285" width="1500" height="260" rx="14"/><text class="label" x="75" y="313">GOVERNED DELIVERY AND CLOUD RUNTIME</text>
  <g><rect class="box" x="80" y="350" width="150" height="58" rx="10"/><text class="t b" x="155" y="384">Developer / PR</text></g>
  <g><rect class="box" x="270" y="350" width="180" height="58" rx="10"/><text class="t" x="360" y="375"><tspan x="360">Credential-Free CI</tspan><tspan class="b" x="360" dy="19">Tests · Scan · Plan</tspan></text></g>
  <g><rect class="gate" x="490" y="350" width="170" height="58" rx="10"/><text class="t" x="575" y="375"><tspan x="575">Protected Main</tspan><tspan class="b" x="575" dy="19">Human Gate</tspan></text></g>
  <g><rect class="live" x="700" y="350" width="180" height="58" rx="10"/><text class="t" x="790" y="375"><tspan x="790">GitHub OIDC</tspan><tspan class="b" x="790" dy="19">Short-Lived Identity</tspan></text></g>
  <g><rect class="live" x="920" y="350" width="170" height="58" rx="10"/><text class="t" x="1005" y="375"><tspan x="1005">Terraform</tspan><tspan class="b" x="1005" dy="19">Cloud Foundation</tspan></text></g>
  <g><rect class="live" x="1130" y="350" width="180" height="58" rx="10"/><text class="t" x="1220" y="375"><tspan x="1220">Immutable Artifact</tspan><tspan class="b" x="1220" dy="19">Digest + Evidence</tspan></text></g>
  <g><rect class="ok" x="1350" y="350" width="170" height="58" rx="10"/><text class="t" x="1435" y="375"><tspan x="1435">Managed Kubernetes</tspan><tspan class="b" x="1435" dy="19">Helm · RBAC · HPA</tspan></text></g>
  <path class="edge" d="M230 379H270"/><path class="edge" d="M450 379H490"/><path class="edge" d="M660 379H700"/><path class="edge" d="M880 379H920"/><path class="edge" d="M1090 379H1130"/><path class="edge" d="M1310 379H1350"/>
  <g><rect class="box" x="900" y="455" width="120" height="52" rx="10"/><text class="t b" x="960" y="486">Queue</text></g>
  <g><rect class="box" x="1060" y="455" width="190" height="52" rx="10"/><text class="t" x="1155" y="477"><tspan x="1155">Serverless Worker</tspan><tspan class="b" x="1155" dy="18">Retry · Idempotency</tspan></text></g>
  <g><rect class="gate" x="1290" y="455" width="150" height="52" rx="10"/><text class="t b" x="1365" y="486">DLQ + Replay</text></g>
  <path class="edge" d="M1435 408V430H960V455"/><path class="edge" d="M1020 481H1060"/><path class="warn" d="M1250 481H1290"/>

  <rect class="band" x="50" y="570" width="1500" height="235" rx="14"/><text class="label" x="75" y="598">OBSERVE → DIAGNOSE → RECOVER → PROVE</text>
  <g><rect class="box" x="110" y="650" width="220" height="62" rx="10"/><text class="t" x="220" y="676"><tspan x="220">Metrics + Logs + Traces</tspan><tspan class="b" x="220" dy="20">Correlation + Redaction</tspan></text></g>
  <g><rect class="gate" x="385" y="650" width="190" height="62" rx="10"/><text class="t" x="480" y="676"><tspan x="480">SLO Alerts</tspan><tspan class="b" x="480" dy="20">Burn Rate + Runbook</tspan></text></g>
  <g><rect class="gate" x="630" y="650" width="210" height="62" rx="10"/><text class="t" x="735" y="676"><tspan x="735">Incident + Runbook</tspan><tspan class="b" x="735" dy="20">Linux · DNS · Network</tspan></text></g>
  <g><rect class="ok" x="895" y="650" width="240" height="62" rx="10"/><text class="t" x="1015" y="676"><tspan x="1015">Recovery Verification</tspan><tspan class="b" x="1015" dy="20">Rollback · Restore · RTO/RPO</tspan></text></g>
  <g><rect class="ok" x="1190" y="650" width="230" height="62" rx="10"/><text class="t" x="1305" y="676"><tspan x="1305">Evidence + Cost</tspan><tspan class="b" x="1305" dy="20">Performance · FinOps · Claims</tspan></text></g>
  <path class="warn" d="M330 681H385"/><path class="warn" d="M575 681H630"/><path class="edge" d="M840 681H895"/><path class="edge" d="M1135 681H1190"/>
  <path class="edge" d="M1435 408V610H220V650"/><path class="edge" d="M1155 507V625H220V650"/>
  <g><rect class="agent" x="1215" y="735" width="205" height="58" rx="10"/><text class="t" x="1317" y="757"><tspan x="1317">Agent-Assisted Evidence +</tspan><tspan x="1317" dy="17">Remediation Proposal</tspan><tspan class="b" x="1317" dy="17">No default mutation</tspan></text></g>
  <path class="warn" d="M1305 712V735"/><path d="M1215 764H575V408" fill="none" stroke="#f3b943" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#amberArrow)"/>
  <text x="905" y="752" font-family="Arial,sans-serif" font-size="11" fill="#f3b943">mutation returns through protected human gate</text>
  <text x="800" y="852" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-style="italic" fill="#a9c9d6">Isolated synthetic-data cloud lab with evidence-backed runtime and recovery drills — not sustained customer-production SRE ownership.</text>
</svg>
