# ContinuityOps — hosted Terraform plan stub via GitHub OIDC (no long-lived keys).
# Does not apply. Requires GitHub Environment + AWS role placeholders to be configured.
name: terraform-plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or recovery-lab
        required: true
        default: staging
        type: choice
        options: [staging, recovery-lab]
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}-plan
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC placeholder)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN || 'arn:aws:iam::000000000000:role/continuityops-staging-plan' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: continuityops-plan

      - name: Plan stub
        run: |
          echo "OIDC plan stub — real terraform plan runs only when role/backend are configured."
          echo "claim_ceiling=L1_until_hosted_plan_evidence"
          node scripts/ci/record-hosted-stub.mjs plan
