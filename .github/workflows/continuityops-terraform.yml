# ContinuityOps live AWS: GitHub OIDC → continuityops-gha (not CursorCloudAgent).
# Loop: PR → plan → human-dispatched apply. Merging to main never applies
# (BF-2026-029): a fmt-only commit re-provisioned the lab and it billed for
# 21 days. Apply is workflow_dispatch-only, by design.
name: ContinuityOps Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/continuityops-terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment:
        description: Terraform environment root
        required: true
        default: staging
        type: choice
        options:
          - staging
          - recovery-lab
          # Account-level cost guardrails. Apply once, then leave alone; it is
          # deliberately absent from teardown.yml so it survives lab teardowns.
          - account

permissions:
  contents: read
  id-token: write

concurrency:
  group: continuityops-tf-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: 'false'
  TF_VAR_aws_account_id: '000000000000'
  TF_STATE_BUCKET: continuityops-tfstate-000000000000
  TF_LOCK_TABLE: continuityops-tf-locks
  # NOTE: TF_VAR_alert_email is deliberately NOT set here. Workflow-level env
  # reaches every job including `plan`, which runs on pull requests, and
  # AGENTS.md forbids giving PR jobs secrets. It is set on the apply job only.

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    env:
      COPS_ENV: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: terraform/envs/${{ env.COPS_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTINUITYOPS || 'arn:aws:iam::000000000000:role/continuityops-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cops-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          # REQUIRED. The default wrapper does not propagate `plan
          # -detailed-exitcode`'s exit code 2, so the no-op guard read "no
          # changes" against a plan of "10 to add" and skipped the apply
          # (run 31267293441). Left on, it silently turns every apply into a
          # no-op — nothing could ever be provisioned.
          terraform_wrapper: false

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Ensure remote state bucket and lock table
        working-directory: ${{ github.workspace }}
        run: bash terraform/ci-bootstrap/ensure-tfstate.sh

      - name: Terraform init
        run: terraform init -input=false -reconfigure

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  apply:
    name: Terraform apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: continuityops
    timeout-minutes: 120
    env:
      # Dispatch-only; the chooser defaults to staging.
      COPS_ENV: ${{ github.event.inputs.environment || 'staging' }}
      # Budget/anomaly alert destination for the `account` root. A SECRET, not a
      # variable: this repository is public, so its Actions logs are public, and
      # Terraform echoes variable values into plan output. GitHub masks secrets
      # in logs; it does not mask variables. Scoped to this job so the
      # PR-triggered plan job never receives it.
      TF_VAR_alert_email: ${{ secrets.COPS_ALERT_EMAIL }}
    defaults:
      run:
        working-directory: terraform/envs/${{ env.COPS_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTINUITYOPS || 'arn:aws:iam::000000000000:role/continuityops-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cops-apply-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          # REQUIRED. The default wrapper does not propagate `plan
          # -detailed-exitcode`'s exit code 2, so the no-op guard read "no
          # changes" against a plan of "10 to add" and skipped the apply
          # (run 31267293441). Left on, it silently turns every apply into a
          # no-op — nothing could ever be provisioned.
          terraform_wrapper: false

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Ensure remote state bucket and lock table
        working-directory: ${{ github.workspace }}
        run: bash terraform/ci-bootstrap/ensure-tfstate.sh

      - name: Terraform init
        run: terraform init -input=false -reconfigure

      # No-op guard (BF-2026-029). Path filters cannot tell a `terraform fmt`
      # commit from a real change — commit 2ab4f2e was 32 insertions / 32
      # deletions of pure whitespace and still re-provisioned the lab. A plan
      # can tell.
      #
      # Decision comes from `terraform show -json`, NOT from the plan exit code.
      # Exit codes travel through the setup-terraform wrapper and a CLI flag;
      # the plan file is ground truth. The wrapper already broke -detailed-exitcode
      # once (run 31267293441: "10 to add" read as "no changes"), and that failure
      # was SILENT — apply skipped, job green. A guard whose failure mode is
      # "quietly does nothing" is worse than no guard, so it no longer depends on
      # the wrapper behaving.
      - name: Terraform plan (no-op guard)
        id: guard
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan

          # Any action other than a lone ["no-op"] counts as a real change.
          changed="$(terraform show -json tfplan \
            | jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length')"

          echo "resource changes: ${changed}"
          if [ "${changed}" -gt 0 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected. Apply will run."
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No resource changes. Skipping apply."
          fi

      - name: Terraform apply
        if: steps.guard.outputs.changes == 'true'
        run: terraform apply -input=false -auto-approve -no-color tfplan
