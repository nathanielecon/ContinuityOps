# ContinuityOps live AWS: GitHub OIDC → continuityops-gha (not CursorCloudAgent).
# Loop: PR → plan → merge to main → apply (no human dispatch after bootstrap).
name: ContinuityOps Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/continuityops-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/continuityops-terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment:
        description: Terraform environment root
        required: true
        default: staging
        type: choice
        options:
          - staging
          - recovery-lab

permissions:
  contents: read
  id-token: write

concurrency:
  group: continuityops-tf-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: 'false'
  TF_VAR_aws_account_id: '000000000000'
  TF_STATE_BUCKET: continuityops-tfstate-000000000000
  TF_LOCK_TABLE: continuityops-tf-locks

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    env:
      COPS_ENV: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: terraform/envs/${{ env.COPS_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTINUITYOPS || 'arn:aws:iam::000000000000:role/continuityops-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cops-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Ensure remote state bucket and lock table
        working-directory: ${{ github.workspace }}
        run: bash terraform/ci-bootstrap/ensure-tfstate.sh

      - name: Terraform init
        run: terraform init -input=false -reconfigure

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  apply:
    name: Terraform apply
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: continuityops
    env:
      # Push to main applies staging; dispatch may choose staging or recovery-lab.
      COPS_ENV: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: terraform/envs/${{ env.COPS_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTINUITYOPS || 'arn:aws:iam::000000000000:role/continuityops-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cops-apply-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Ensure remote state bucket and lock table
        working-directory: ${{ github.workspace }}
        run: bash terraform/ci-bootstrap/ensure-tfstate.sh

      - name: Terraform init
        run: terraform init -input=false -reconfigure

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color
