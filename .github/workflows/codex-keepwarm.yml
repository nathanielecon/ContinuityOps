# ContinuityOps — Codex Cloud Environment keep-warm (D-031 / D-033)
#
# Empirically (2026-07-17 workflow_dispatch on issue #4): a @codex mention
# authored by github-actions[bot] did NOT receive a chatgpt-codex-connector
# reply. Scheduled bot keep-warm is therefore DISABLED to avoid false confidence.
# Keep-warm carrier = supervisor-authored @codex smoke on issue #4 (~9h).
# This workflow remains for manual experiments (workflow_dispatch only).
name: codex-keepwarm

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  keepwarm:
    runs-on: ubuntu-latest
    steps:
      - name: Post @codex keep-warm smoke on the keep-warm record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 4 --repo "${{ github.repository }}" --body \
            "@codex 保暖冒烟(自动,零派遣,实验):请启动一次最小任务——读取仓库根 README.md 的第一行并原样回复,勿改动任何文件、勿开 PR。注意:github-actions[bot] 作者提及此前未获 App 回复;本评论仅作复测。"
