# ContinuityOps lab teardown — terraform destroy via continuityops-gha (OIDC).
#
# Teardown is the SAFE direction and is therefore automated (BF-2026-029);
# apply is the risky direction and stays human-dispatched. A nightly destroy that
# fires when you did not want it costs ten minutes of re-apply; a stray apply that
# nobody notices cost $295.
#
# The nightly schedule targets `staging` only. `account` is deliberately absent
# from the options below — it holds the budget guardrails and must never be
# destroyed by this workflow.
#
# Escape hatch: set repository variable COPS_LAB_KEEP_ALIVE=true to skip the
# scheduled run while keeping manual dispatch available. Unset it when done.
name: teardown

on:
  schedule:
    # 06:00 UTC nightly. Anything left running dies within ~24h, not 21 days.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform env root to destroy
        required: true
        type: choice
        options: [staging, recovery-lab]
      confirm:
        description: Type teardown to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: continuityops-teardown-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: 'false'
  TF_STATE_BUCKET: continuityops-tfstate-000000000000
  TF_LOCK_TABLE: continuityops-tf-locks

jobs:
  destroy:
    # Scheduled runs carry no inputs, so they cannot satisfy the confirm gate;
    # they get their own branch guarded by the keep-alive variable instead.
    if: >
      (github.event_name == 'schedule' && vars.COPS_LAB_KEEP_ALIVE != 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'teardown')
    runs-on: ubuntu-latest
    environment: continuityops
    env:
      COPS_ENV: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: terraform/envs/${{ env.COPS_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTINUITYOPS || 'arn:aws:iam::000000000000:role/continuityops-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-cops-teardown-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          # The wrapper is unreliable about propagating terraform's exit status
          # (proven on run 31267293441). On a teardown that means a FAILED destroy
          # could report success and leave resources billing while the run shows
          # green — the exact silent-failure shape as BF-2026-029.
          terraform_wrapper: false

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: Ensure remote state
        working-directory: ${{ github.workspace }}
        run: bash terraform/ci-bootstrap/ensure-tfstate.sh

      - name: Terraform init
        run: terraform init -input=false -reconfigure

      - name: Inventory before destroy
        run: terraform state list || true

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve -no-color
