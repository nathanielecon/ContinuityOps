# Agentic evidence-gather / remediation proposal (no default mutation).
name: agentic-evidence

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: Alert or incident id
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gather:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/continuityops-evidence')
    runs-on: ubuntu-latest
    environment: agentic-proposal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Evidence gather stub
        run: |
          echo "Read-only evidence gather stub for ${{ github.event.inputs.alert_id || 'comment' }}"
          echo "No mutation. Protected environment placeholder retained (D-044)."
