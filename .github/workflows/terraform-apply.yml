# ContinuityOps — protected apply stub (OIDC). Never runs on untrusted PRs.
name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, recovery-lab]
      confirm:
        description: Type apply to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC placeholder)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY || 'arn:aws:iam::000000000000:role/continuityops-staging-apply' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: continuityops-apply

      - name: Apply stub (no real mutation without configured role)
        run: |
          echo "Apply stub — L4 cloud-applied is NOT claimed until a successful apply with evidence."
          node scripts/ci/record-hosted-stub.mjs apply
