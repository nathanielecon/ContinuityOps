# ContinuityOps — evidence artifact packaging stub (no secrets).
name: evidence-upload

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Collect evidence index
        run: node scripts/ci/package-evidence.mjs

      - name: Upload evidence bundle
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: continuityops-evidence
          path: evidence/_bundle/
          if-no-files-found: warn
