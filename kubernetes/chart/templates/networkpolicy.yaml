{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuityops.fullname" . }}
  labels:
    {{- include "continuityops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "continuityops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowIngressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    {{- range .Values.networkPolicy.allowEgressToPorts }}
    - ports:
        - protocol: TCP
          port: {{ . }}
    {{- end }}
{{- end }}
